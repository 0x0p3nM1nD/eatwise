<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забравена парола - EatWise</title>
    <!-- Използваме същия CSS файл -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">
        <!-- Лява част: Parallax с лого и копирайт -->
        <div class="auth-visual" id="parallax-container">

            <!-- Фонова снимка с паралакс ефект -->
            <div class="parallax-bg-wrapper parallax-layer" data-speed="-0.8">
                <img src="../assets/bakery-bg.jpg" alt="EatWise Bakery" class="parallax-bg-img">
            </div>

            <!-- 1. Горе вляво: Малко лого -->
            <div class="parallax-header">
                <!-- Може да използвате logo.svg или да сложите текстово лого/SVG директно -->
                <img src="../assets/logo.png" alt="EatWise Logo" class="parallax-logo">
            </div>

            <!-- 2. Долу вляво: Копирайт текст -->
            <div class="parallax-footer">
                <span>&copy; Eatwise</span>
            </div>

        </div>

        <!-- Дясна част: Форма -->
        <div class="auth-form-side">
            <div class="form-wrapper">

                <!-- ЕКРАН 1: Форма за въвеждане на имейл -->
                <form id="forgot-form" class="auth-form active" onsubmit="event.preventDefault();">
                    <h2>Забравена парола</h2>
                    <p class="form-subtitle">Въведете вашия имейл и ще ви изпратим линк за възстановяване.</p>

                    <div class="input-group">
                        <label for="forgot-email">Имейл адрес</label>
                        <input type="email" id="forgot-email" placeholder="example@mail.com" required>
                    </div>

                    <button type="submit" class="primary-btn">Изпрати линк</button>

                    <div class="back-to-login-wrapper">
                        <!-- Връщане към оригиналната страница за вход -->
                        <a href="business-auth.html" class="back-link-btn">
                            &#8592; Обратно към вход
                        </a>
                    </div>
                </form>

                <!-- ЕКРАН 2: Потвърждение (Показва се след изпращане) -->
                <div id="forgot-success" class="auth-form">
                    <div class="success-icon">&#10003;</div>
                    <h2>Проверете пощата си</h2>
                    <p class="form-subtitle">
                        Изпратихме инструкции за възстановяване на паролата на <strong id="sent-email-span"></strong>.
                    </p>
                    <a href="business-auth.html" style="text-decoration: none;">
                        <button type="button" class="primary-btn">Към входа</button>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Използваме скрипта за забравена парола -->
    <script src="auth.js"></script>
   <script src="/loader.js"></script>
<script src="/tracker.js"></script>
</body>

</html>
